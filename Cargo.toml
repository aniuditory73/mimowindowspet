[package]
name = "mimo"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-18", "raw-window-handle-06", "renderer-software", "system-tray", "unstable-winit-030"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }
